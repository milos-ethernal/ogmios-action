name: Test

on: 
  workflow_dispatch:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: '1.20'
    
    - name: Install ogmios
      uses: ./
      with:
        tag: 'v6.14.0'
        sufix: '11'

    - name: Test
      run: |
        test -x "$(command -v ogmios-11)"
        ! command -v ogmios
        ogmios-11 --version
